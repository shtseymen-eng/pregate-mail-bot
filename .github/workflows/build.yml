name: Windows Kurulum Paketi

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Kodu cek
        uses: actions/checkout@v4

      - name: Python 3.11 kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Python bagimliliklar
        run: pip install customtkinter selenium pyinstaller pywin32 webdriver-manager pillow

      - name: Ikon ICO olustur
        run: python make_ico.py

      - name: PyInstaller ile derle
        run: pyinstaller wa_mail_bot.spec

      - name: Inno Setup kur
        run: choco install innosetup --yes

      - name: Kurulum paketi olustur
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" setup.iss'

      - name: Kurulum EXE yukle
        uses: actions/upload-artifact@v4
        with:
          name: PregateMail_Kurulum
          path: installer_output\PregateMail_Kurulum.exe
          retention-days: 60
