name: Windows Kurulum Paketi

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Bagimliliklar
        run: pip install customtkinter selenium pyinstaller pywin32 pillow webdriver-manager
      - name: Ikon olustur
        run: python make_ico.py
      - name: PyInstaller
        run: pyinstaller wa_mail_bot.spec
      - name: Inno Setup kur
        run: choco install innosetup --yes
      - name: Setup olustur
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" setup.iss'
      - name: Artifact yukle
        uses: actions/upload-artifact@v4
        with:
          name: PregateMail_Kurulum
          path: installer_output\PregateMail_Kurulum.exe
          retention-days: 60
